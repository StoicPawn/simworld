name: Run Generational World

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Simulation seed"
        required: true
        default: "104729"
        type: string
      years:
        description: "Years"
        required: true
        default: "40"
        type: string
      settlements:
        description: "Initial settlements"
        required: true
        default: "6"
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run generational world
        run: >-
          python scripts/run_generational_world.py
          --seed "${{ inputs.seed }}"
          --years "${{ inputs.years }}"
          --settlements "${{ inputs.settlements }}"
          --output "runs/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: generational-world-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
