name: Run Epistemic Social World

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Simulation seed"
        required: true
        default: "104729"
        type: string
      years:
        description: "Years to simulate"
        required: true
        default: "40"
        type: string
      width:
        description: "Map width in cells"
        required: true
        default: "96"
        type: string
      height:
        description: "Map height in cells"
        required: true
        default: "72"
        type: string
      settlements:
        description: "Initial settlements / local houses"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run epistemic social world
        run: >-
          python scripts/run_social_world.py
          --seed "${{ inputs.seed }}"
          --years "${{ inputs.years }}"
          --width "${{ inputs.width }}"
          --height "${{ inputs.height }}"
          --settlements "${{ inputs.settlements }}"
          --output "runs/social-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload simulation artifact
        uses: actions/upload-artifact@v4
        with:
          name: simworld-social-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/social-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
