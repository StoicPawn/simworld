name: Run SimWorld

on:
  workflow_dispatch:
    inputs:
      config:
        description: "World config path"
        required: true
        default: "configs/worlds/kernel_smoke.json"
        type: string
      seed:
        description: "Simulation seed"
        required: true
        default: "0"
        type: string
      horizon:
        description: "Simulation horizon"
        required: true
        default: "100"
        type: string
      execution:
        description: "Execution environment"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - local
          - cloud

permissions:
  contents: read
  actions: read

jobs:
  router:
    runs-on: ubuntu-latest
    outputs:
      use_local: ${{ steps.choose.outputs.use_local }}
    steps:
      - name: Choose execution environment
        id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.execution }}
        shell: bash
        run: |
          if [ "$MODE" = "local" ]; then
            echo "use_local=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MODE" = "cloud" ]; then
            echo "use_local=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNNERS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" 2>/dev/null || true)"
          if [ -z "$RUNNERS" ]; then
            echo "use_local=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT="$(printf '%s' "$RUNNERS" | jq '[.runners[] | select(any(.labels[]; .name == "agent-pc")) | select(.status == "online" and .busy == false)] | length')"
          if [ "$COUNT" -gt 0 ]; then
            echo "use_local=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_local=false" >> "$GITHUB_OUTPUT"
          fi

  local:
    needs: router
    if: needs.router.outputs.use_local == 'true'
    runs-on: [self-hosted, agent-pc]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap project
        run: python scripts/bootstrap.py
      - name: Run simulation
        run: >-
          python scripts/run_simulation.py
          --config "${{ inputs.config }}"
          --seed "${{ inputs.seed }}"
          --horizon "${{ inputs.horizon }}"
          --output "runs/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload simulation artifact
        uses: actions/upload-artifact@v4
        with:
          name: simworld-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30

  cloud:
    needs: router
    if: needs.router.outputs.use_local != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap project
        run: python scripts/bootstrap.py
      - name: Run simulation
        run: >-
          python scripts/run_simulation.py
          --config "${{ inputs.config }}"
          --seed "${{ inputs.seed }}"
          --horizon "${{ inputs.horizon }}"
          --output "runs/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload simulation artifact
        uses: actions/upload-artifact@v4
        with:
          name: simworld-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
