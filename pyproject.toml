[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simworld"
version = "0.1.0"
description = "Multi-scale procedural world and emergent-history simulation engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "StoicPawn" }]
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["simworld"]
