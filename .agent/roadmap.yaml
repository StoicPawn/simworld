project: simworld
version: 10
current_phase: spatial_life_and_emergent_places

foundational_principles:
  geopolitical_by_construction: true
  spatial_first: true
  time_and_space_are_coequal_substrates: true
  map_is_causal_state_not_decoration: true
  micro_geography_can_compound_historically: true
  place_importance_is_emergent: true
  place_labels_are_derived_views: true
  regions_are_derived_views: true
  strategic_value_is_emergent: true
  physical_truth_separate_from_actor_spatial_knowledge: true
  needs_are_pressures_not_policies: true
  actors_are_non_omniscient: true
  experience_belief_speech_action_are_distinct: true
  trust_is_contextual_and_historical: true
  stories_are_information_objects_not_truth: true
  culture_is_emergent: true
  biological_kinship_is_not_social_identity: true
  household_is_not_kinship: true
  family_house_dynasty_are_emergent: true
  assets_precede_property_regimes: true
  possession_use_control_claim_are_distinct: true
  recognition_is_actor_specific: true
  documents_are_evidence_not_truth: true
  formal_property_is_derived_from_institutions: true
  organization_is_not_state: true
  authority_is_not_legitimacy: true
  never_target_event_counts: true
  prefer_generic_primitives_and_derived_views: true

phases:
  - id: phase_0_kernel
    status: implemented
    capabilities: [entity, event, world_state, causal_graph, relevance, adaptive_resolution, event_driven_scheduler]

  - id: phase_0_automation
    status: implemented
    capabilities: [permanent_agent_rules, remote_workflow_dispatch, bounded_agent_loop, validation_pipeline, simulation_dispatch_skeleton, ordered_development_ledger]

  - id: phase_1_core_foundations
    status: planned
    capabilities: [typed_relations, state_delta_reducers, deterministic_rng_substreams, serialization, experiment_metadata]

  - id: phase_2_spatial_foundation
    status: in_progress
    implemented_capabilities: [planar_coordinate_grid, raster_grid_abstraction, lazy_chunk_allocation, aligned_spatial_layers, neighbourhood_queries, movement_cost_surface, passability_layer, least_cost_routing_a_star]
    remaining_capabilities: [coordinate_reference_system, real_world_georeferencing, chunk_persistence, multi_resolution_tiles, deterministic_spatial_rng_substreams]

  - id: phase_3_physical_geography
    status: vertical_slice_implemented
    implemented_capabilities: [generated_elevation, slope, land_water, rainfall_baseline, temperature_baseline, fertility, timber_truth, ore_truth, habitability, accessibility]
    remaining_capabilities: [coastline_topology, drainage, rivers_lakes, soils, biomes, renewable_resource_stocks, dynamic_climate, hazards]

  - id: phase_4_population
    status: in_progress
    implemented_capabilities: [settlement_population, geography_constrained_settlement_sites, food_linked_demography, geography_constrained_migration, materialized_persons, biological_birth_death]
    remaining_capabilities: [distributed_population_raster, demographic_cohorts, adaptive_person_materialization, settlement_founding_abandonment, household_relocation]

  - id: phase_4b_epistemic_social_foundation
    status: in_progress
    implemented_capabilities: [needs_as_pressures, probabilistic_beliefs, memory_traces, contextual_trust, messages_and_distortion, perceived_strategy_learning, narrative_information_objects, narrative_transmission_and_mutation, multiplex_social_network, biological_kinship_graph, derived_lineages]
    remaining_capabilities: [causal_models_inside_agents, memory_retrieval_and_forgetting, richer_deception_strategy, identity_and_group_membership, norms_and_sanctions, institutional_memory, endogenous_value_formation]

  - id: phase_4c_life_processes
    status: in_progress
    implemented_capabilities: [household_registry, pregnancy_state, gestation_delay, relationship_evolution, probabilistic_separation, multi_asset_estate, competing_succession_claims]
    remaining_capabilities: [reconciliation_process, caregiving_events, childhood_development, education_and_socialization, household_fission_fusion, adoption_and_incorporation, family_self_recognition, outsider_recognition, emergent_house_detection]

  - id: phase_4d_spatial_life
    status: in_progress
    implemented_capabilities:
      - materialized_person_cell_presence
      - lazy_presence_for_new_people
      - bounded_stochastic_local_movement
      - physical_cell_attractiveness
      - accumulated_familiarity
      - co_presence_encounters
      - encounter_driven_acquaintance_or_rivalry
      - cell_visit_history
      - unique_visitor_history
      - cell_encounter_history
      - productive_use_history
      - derived_site_intensity
      - active_site_views
    remaining_capabilities:
      - persistent_multi_step_travel
      - route_memory
      - habitual_vs_temporary_presence
      - need_driven_tasks
      - work_foraging_care_exchange_trips
      - individual_and_household_relocation
      - encounter_driven_information_exchange
      - route_views
      - settlement_views
      - market_views
      - path_wear_and_infrastructure_emergence

  - id: phase_5_social_economic
    status: in_progress
    implemented_capabilities: [explicit_asset_registry, temporal_asset_relations, possession_use_control_claim_separation, observer_specific_claim_recognition, household_inventories, generic_production_process, real_stock_consumption, bilateral_barter, spatially_constrained_exchange, general_obligation_registry, grain_credit_vertical_slice, storage_profiles, spoilage, heterogeneous_demand, local_material_shocks]
    remaining_capabilities: [cell_level_resource_extraction, renewable_resource_dynamics, cell_parcel_asset_relations, contested_control, generic_evidence_document_objects, transport_capacity_and_loss, richer_credit, debt_networks, rent_tribute_tax, labour_service, endogenous_specialization, organization_level_production, inheritance_of_asset_relations]

  - id: phase_5b_institutional_emergence
    status: in_progress
    implemented_capabilities: [cooperation_ledger, generic_organization_registry, organization_membership, shared_resources, probabilistic_organization_formation, derived_domain_authority_index, separate_legitimacy_signal]
    remaining_capabilities: [organization_fission_merge_competition, nested_organizations, leadership_and_roles, offices_and_role_succession, rules_and_norms, institutional_memory, enforcement_capacity, protection_and_extraction, collective_action, organizational_identity]

  - id: phase_6_political_epistemic
    status: foundation_started
    next_prerequisites: [spatial_control_fields, territorial_claims, protection_extraction, coercive_capacity, recognized_offices, coalition_processes]
    capabilities: [states_as_derived_configurations, authority, claims, territorial_control, borders, diplomacy, actor_information, actor_spatial_knowledge, strategic_deception, legitimacy, political_learning]

  - id: phase_7_culture_institutions_conflict
    status: planned
    capabilities: [family_and_dynastic_memory, norms, ideology, religion, emergent_political_culture, institutional_path_dependence, conflict, military_capacity, terrain_constrained_operations, fronts_and_occupation, historical_views, narrative_extraction]

  - id: phase_8_experiments
    status: planned
    capabilities: [batch_simulation, counterfactuals, sensitivity_analysis, trajectory_comparison, causal_attribution, epistemic_counterfactuals]

  - id: phase_9_inverse_inference
    status: planned
    capabilities: [latent_hypotheses, approximate_bayesian_inference, abductive_search, posterior_over_explanations, hidden_spatial_resource_information_belief_institution_hypotheses]

  - id: phase_10_real_world
    status: long_term
    capabilities: [real_world_geospatial_ingestion, empirical_calibration, historical_reconstruction, geopolitical_scenario_analysis, uncertainty_aware_helper]

constraints:
  never_assume_single_story: true
  relevance_must_not_create_causality: true
  quiet_regions_continue_evolving: true
  actor_information_must_not_leak_world_truth: true
  needs_must_not_call_prescribed_actions: true
  narratives_must_not_replace_event_truth: true
  kinship_must_not_imply_loyalty: true
  household_must_not_imply_blood_relation: true
  asset_must_not_imply_property: true
  claim_must_not_imply_recognition: true
  recognition_must_not_imply_control: true
  documents_must_not_be_global_truth: true
  formal_property_requires_institutional_context: true
  organization_must_not_imply_statehood: true
  authority_must_not_imply_legitimacy: true
  do_not_tune_for_target_event_counts: true
  place_importance_must_not_be_hard_coded: true
  site_intensity_must_not_itself_cause_visits: true
  co_presence_required_for_encounter_derived_ties: true
  prefer_generic_primitives_over_era_specific_categories: true
  avoid_heavyweight_object_per_planet_cell: true
  material_changes_require_development_ledger_update: true
  automatic_merge_main: false
