project: simworld
version: 5
current_phase: first_real_world_plus_epistemic_generational_relational_foundations

foundational_principles:
  geopolitical_by_construction: true
  spatial_first: true
  time_and_space_are_coequal_substrates: true
  map_is_causal_state_not_decoration: true
  regions_are_derived_views: true
  strategic_value_is_emergent: true
  physical_truth_separate_from_actor_spatial_knowledge: true
  needs_are_pressures_not_policies: true
  actors_are_non_omniscient: true
  experience_belief_speech_action_are_distinct: true
  trust_is_contextual_and_historical: true
  perceived_learning_may_differ_from_causal_truth: true
  stories_are_information_objects_not_truth: true
  culture_is_emergent: true
  no_canonical_historical_interpretation: true
  seek_prime_causal_matrices: true
  macro_labels_observational_by_default: true
  macro_classifiers_causally_inert: true
  conflict_is_not_war: true
  cooperation_is_not_alliance: true
  relations_are_multiplex_and_domain_specific: true
  same_primitive_matrix_allows_multiple_outcomes: true

phases:
  - id: phase_0_kernel
    status: implemented
    capabilities:
      - entity
      - event
      - world_state
      - causal_graph
      - relevance
      - adaptive_resolution
      - event_driven_scheduler

  - id: phase_0_automation
    status: implemented
    depends_on: [phase_0_kernel]
    capabilities:
      - permanent_agent_rules
      - remote_workflow_dispatch
      - bounded_agent_loop
      - validation_pipeline
      - simulation_dispatch_skeleton
      - local_cloud_capability_routing

  - id: phase_1_core_foundations
    status: planned
    execution_track: core
    capabilities:
      - typed_relations
      - state_delta_reducers
      - deterministic_rng_substreams
      - serialization
      - experiment_metadata

  - id: phase_2_spatial_foundation
    status: in_progress
    execution_track: spatial
    implemented_capabilities:
      - planar_coordinate_grid
      - raster_grid_abstraction
      - lazy_chunk_allocation
      - aligned_spatial_layers
      - neighbourhood_queries
      - distance_utilities
      - movement_cost_surface
      - elevation_slope_movement_penalty
      - passability_layer
      - least_cost_routing_a_star
    remaining_capabilities:
      - coordinate_reference_system
      - real_world_georeferencing
      - chunk_persistence
      - spatial_serialization
      - region_views_over_cells
      - sparse_spatial_indexes
      - multi_resolution_tiles
      - deterministic_spatial_rng_substreams

  - id: phase_3_physical_geography
    status: vertical_slice_implemented
    capabilities:
      - generated_elevation
      - slope
      - land_water
      - rainfall_baseline
      - temperature_baseline
      - fertility
      - timber_truth
      - ore_truth
      - habitability
      - accessibility
    remaining_capabilities:
      - coastline_topology
      - drainage
      - rivers_lakes
      - soils
      - biomes
      - renewable_resource_stocks
      - dynamic_climate
      - hazards

  - id: phase_4_population
    status: vertical_slice_implemented
    capabilities:
      - settlement_population
      - geography_constrained_settlement_sites
      - food_linked_demography
      - geography_constrained_migration
      - biological_person_records
      - probabilistic_births
      - deaths
      - kinship_graph
      - lineage_views
      - multiplex_social_networks
    remaining_capabilities:
      - distributed_population_raster
      - cohorts
      - households
      - pregnancy_gestation
      - child_dependency
      - relationship_evolution
      - adaptive_person_materialization
      - settlement_founding_abandonment

  - id: phase_4b_epistemic_social_foundation
    status: in_progress
    may_progress_in_parallel_with: [phase_1_core_foundations, phase_2_spatial_foundation]
    implemented_capabilities:
      - needs_as_pressures
      - probabilistic_beliefs
      - memory_traces
      - contextual_trust
      - messages_and_distortion
      - later_message_accuracy_evaluation
      - perceived_strategy_learning
      - latent_effect_separation
      - bounded_stochastic_action_choice
      - narrative_information_objects
      - narrative_transmission_and_mutation
      - derived_culture_signal
      - biological_generations
      - multiplex_social_networks
    remaining_capabilities:
      - causal_models_inside_agents
      - memory_retrieval_and_forgetting
      - richer_deception_strategy
      - identity_and_group_membership
      - norms_and_sanctions
      - generations_and_role_succession
      - institutional_memory
      - endogenous_value_formation
      - metacognition_and_confidence_calibration

  - id: phase_4c_primitive_relational_matrix
    status: foundation_implemented
    may_progress_in_parallel_with: [phase_4b_epistemic_social_foundation, phase_5_social_economic]
    implemented_capabilities:
      - actor_interests_by_domain_and_target
      - perceived_claims
      - relational_compatibility
      - relational_incompatibility
      - capabilities_and_constraints
      - trust_dependence_contact_uncertainty_matrix
      - bounded_stochastic_primitive_interaction_choice
      - primitive_communication_negotiation_exchange_coordination
      - primitive_withholding_threat_obstruction_seizure_attack_avoidance
      - retrospective_sustained_cooperation_classifier
      - retrospective_competitive_rivalry_classifier
      - retrospective_violent_feud_classifier
      - retrospective_alliance_like_classifier
      - retrospective_war_like_classifier
      - causally_inert_macro_pattern_invariant
    remaining_capabilities:
      - perceived_relation_matrices_per_actor
      - interaction_memory_feedback
      - coalition_formation_from_networks
      - third_party_mediation
      - multi_actor_claim_collisions
      - endogenous_commitments_treaties_oaths
      - mobilization_and_logistics_as_lower_level_processes
      - organizational_command_and_compliance
      - escalation_deescalation_without_macro_state_machine
      - pattern_detection_over_dynamic_coalitions

  - id: phase_5_social_economic
    status: planned
    depends_on: [phase_3_physical_geography, phase_4_population]
    capabilities:
      - production
      - consumption
      - inventories
      - trade
      - wealth
      - organizations
      - families_lineages
      - institutions
      - infrastructure_growth
      - market_accessibility

  - id: phase_6_political_epistemic
    status: foundation_started
    depends_on: [phase_5_social_economic, phase_4b_epistemic_social_foundation, phase_4c_primitive_relational_matrix]
    capabilities:
      - states
      - authority
      - claims
      - territorial_control
      - borders
      - diplomacy
      - actor_information
      - actor_spatial_knowledge
      - strategic_deception
      - legitimacy
      - political_learning
      - bounded_llm_decisions

  - id: phase_7_culture_institutions_conflict
    status: planned
    depends_on: [phase_6_political_epistemic]
    capabilities:
      - family_and_dynastic_memory
      - norms
      - ideology
      - religion
      - emergent_political_culture
      - institutional_path_dependence
      - conflict_patterns
      - coercive_capacity
      - logistics
      - terrain_constrained_operations
      - fronts_and_occupation_as_derived_spatial_patterns
      - historical_views
      - narrative_extraction

  - id: phase_8_experiments
    status: planned
    depends_on: [phase_7_culture_institutions_conflict]
    capabilities:
      - batch_simulation
      - counterfactuals
      - sensitivity_analysis
      - trajectory_comparison
      - causal_attribution
      - epistemic_counterfactuals
      - narrative_path_dependence_analysis

  - id: phase_9_inverse_inference
    status: planned
    depends_on: [phase_8_experiments]
    capabilities:
      - latent_hypotheses
      - approximate_bayesian_inference
      - abductive_search
      - posterior_over_explanations
      - hidden_spatial_hypotheses
      - hidden_resource_hypotheses
      - hidden_information_hypotheses
      - hidden_belief_hypotheses

  - id: phase_10_real_world
    status: long_term
    depends_on: [phase_9_inverse_inference]
    capabilities:
      - real_world_geospatial_ingestion
      - empirical_calibration
      - historical_reconstruction
      - geopolitical_scenario_analysis
      - uncertainty_aware_helper
      - spatially_and_epistemically_grounded_inverse_analysis

constraints:
  never_assume_single_story: true
  relevance_must_not_create_causality: true
  quiet_regions_continue_evolving: true
  support_simultaneous_events: true
  actor_information_must_not_leak_world_truth: true
  needs_must_not_call_prescribed_actions: true
  communication_may_be_false_or_incomplete: true
  perceived_reward_must_be_distinguishable_from_latent_effect: true
  narratives_must_not_replace_event_truth: true
  culture_must_not_be_unexplained_static_stereotype: true
  avoid_heavyweight_object_per_planet_cell: true
  strategic_value_must_be_derived: true
  biological_kinship_must_not_imply_loyalty: true
  partnership_must_not_imply_offspring: true
  macro_patterns_must_not_drive_primitive_events: true
  war_label_must_not_generate_battles: true
  alliance_label_must_not_guarantee_assistance: true
  conflict_must_not_imply_violence: true
  automatic_merge_main: false
