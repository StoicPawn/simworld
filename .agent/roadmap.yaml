project: simworld
version: 3
current_phase: phase_2_spatial_foundation

foundational_principles:
  geopolitical_by_construction: true
  spatial_first: true
  time_and_space_are_coequal_substrates: true
  map_is_causal_state_not_decoration: true
  regions_are_derived_views: true
  strategic_value_is_emergent: true
  physical_truth_separate_from_actor_spatial_knowledge: true

phases:
  - id: phase_0_kernel
    status: implemented
    capabilities:
      - entity
      - event
      - world_state
      - causal_graph
      - relevance
      - adaptive_resolution
      - event_driven_scheduler

  - id: phase_0_automation
    status: implemented
    depends_on: [phase_0_kernel]
    capabilities:
      - permanent_agent_rules
      - remote_workflow_dispatch
      - bounded_agent_loop
      - validation_pipeline
      - simulation_dispatch_skeleton
      - local_cloud_capability_routing
      - spatial_foundation_contract

  - id: phase_1_core_foundations
    status: planned
    depends_on: [phase_0_automation]
    execution_track: core
    capabilities:
      - typed_relations
      - state_delta_reducers
      - deterministic_rng_substreams
      - serialization
      - experiment_metadata

  - id: phase_2_spatial_foundation
    status: in_progress
    depends_on: [phase_0_automation]
    execution_track: spatial
    may_progress_in_parallel_with: [phase_1_core_foundations]
    implemented_capabilities:
      - planar_coordinate_grid
      - raster_grid_abstraction
      - lazy_chunk_allocation
      - aligned_spatial_layers
      - neighbourhood_queries
      - distance_utilities
      - movement_cost_surface
      - elevation_slope_movement_penalty
      - passability_layer
      - least_cost_routing_a_star
    remaining_capabilities:
      - coordinate_reference_system
      - real_world_georeferencing
      - world_extent_projection_policy
      - chunk_persistence
      - spatial_serialization
      - region_views_over_cells
      - spatial_indexes_for_sparse_entities
      - multi_resolution_tiles
      - deterministic_spatial_generation_substreams
      - spatial_boundary_tests_at_scale

  - id: phase_3_physical_geography
    status: planned
    depends_on: [phase_2_spatial_foundation]
    capabilities:
      - elevation_generation_or_ingestion
      - slope
      - land_water
      - coastline
      - hydrology_basics
      - rivers_lakes
      - terrain_biome
      - climate_baseline
      - natural_hazards_basics
      - spatial_resources
      - accessibility
      - background_region_processes

  - id: phase_4_population
    status: planned
    depends_on: [phase_3_physical_geography]
    capabilities:
      - demographic_aggregates
      - settlement_density
      - households
      - migration
      - mortality_births
      - adaptive_person_materialization
      - population_spatial_distribution

  - id: phase_5_social_economic
    status: planned
    depends_on: [phase_4_population]
    capabilities:
      - production
      - consumption
      - trade
      - wealth
      - organizations
      - families_lineages
      - institutions
      - infrastructure_growth
      - network_effects
      - market_accessibility

  - id: phase_6_political_epistemic
    status: planned
    depends_on: [phase_5_social_economic]
    capabilities:
      - states
      - authority
      - claims
      - territorial_control
      - contested_cells
      - borders_as_dynamic_layers
      - diplomacy
      - actor_information
      - actor_spatial_knowledge
      - beliefs
      - misinformation
      - hidden_spatial_information
      - bounded_llm_decisions

  - id: phase_7_conflict_history
    status: planned
    depends_on: [phase_6_political_epistemic]
    capabilities:
      - conflict
      - military_capacity
      - military_logistics
      - terrain_constrained_operations
      - fronts_and_occupation
      - succession
      - dynastic_politics
      - historical_views
      - narrative_extraction

  - id: phase_8_experiments
    status: planned
    depends_on: [phase_7_conflict_history]
    capabilities:
      - batch_simulation
      - counterfactuals
      - sensitivity_analysis
      - trajectory_comparison
      - causal_attribution
      - spatial_sensitivity_analysis

  - id: phase_9_inverse_inference
    status: planned
    depends_on: [phase_8_experiments]
    capabilities:
      - latent_hypotheses
      - approximate_bayesian_inference
      - abductive_search
      - posterior_over_explanations
      - latent_spatial_hypotheses
      - hidden_resource_hypotheses
      - hidden_accessibility_hypotheses

  - id: phase_10_real_world
    status: long_term
    depends_on: [phase_9_inverse_inference]
    capabilities:
      - real_world_geospatial_ingestion
      - empirical_calibration
      - historical_reconstruction
      - geopolitical_scenario_analysis
      - uncertainty_aware_helper
      - spatially_grounded_inverse_analysis

constraints:
  never_assume_single_story: true
  relevance_must_not_create_causality: true
  quiet_regions_continue_evolving: true
  support_simultaneous_events: true
  preserve_partial_information_future_layer: true
  spatial_foundation_precedes_deep_population_economy_politics: true
  avoid_heavyweight_object_per_planet_cell: true
  preserve_layer_separation: true
  strategic_value_must_be_derived: true
  automatic_merge_main: false
