project: simworld
version: 1
current_phase: phase_0_automation

phases:
  - id: phase_0_kernel
    status: implemented
    capabilities:
      - entity
      - event
      - world_state
      - causal_graph
      - relevance
      - adaptive_resolution
      - event_driven_scheduler

  - id: phase_0_automation
    status: in_progress
    depends_on: [phase_0_kernel]
    capabilities:
      - permanent_agent_rules
      - remote_workflow_dispatch
      - bounded_agent_loop
      - validation_pipeline
      - simulation_dispatch_skeleton
      - local_cloud_capability_routing

  - id: phase_1_foundations
    status: planned
    depends_on: [phase_0_automation]
    capabilities:
      - typed_relations
      - state_delta_reducers
      - deterministic_rng_substreams
      - serialization
      - experiment_metadata

  - id: phase_2_physical_world
    status: planned
    depends_on: [phase_1_foundations]
    capabilities:
      - geography
      - regions
      - terrain
      - climate_basics
      - resources
      - accessibility
      - infrastructure_basics
      - background_region_processes

  - id: phase_3_population
    status: planned
    depends_on: [phase_2_physical_world]
    capabilities:
      - demographic_aggregates
      - households
      - migration
      - mortality_births
      - adaptive_person_materialization

  - id: phase_4_social_economic
    status: planned
    depends_on: [phase_3_population]
    capabilities:
      - production
      - consumption
      - trade
      - wealth
      - organizations
      - families_lineages
      - institutions

  - id: phase_5_political_epistemic
    status: planned
    depends_on: [phase_4_social_economic]
    capabilities:
      - states
      - authority
      - claims
      - diplomacy
      - actor_information
      - beliefs
      - misinformation
      - bounded_llm_decisions

  - id: phase_6_conflict_history
    status: planned
    depends_on: [phase_5_political_epistemic]
    capabilities:
      - conflict
      - military_capacity
      - succession
      - dynastic_politics
      - historical_views
      - narrative_extraction

  - id: phase_7_experiments
    status: planned
    depends_on: [phase_6_conflict_history]
    capabilities:
      - batch_simulation
      - counterfactuals
      - sensitivity_analysis
      - trajectory_comparison
      - causal_attribution

  - id: phase_8_inverse_inference
    status: planned
    depends_on: [phase_7_experiments]
    capabilities:
      - latent_hypotheses
      - approximate_bayesian_inference
      - abductive_search
      - posterior_over_explanations

  - id: phase_9_real_world
    status: long_term
    depends_on: [phase_8_inverse_inference]
    capabilities:
      - empirical_calibration
      - historical_reconstruction
      - geopolitical_scenario_analysis
      - uncertainty_aware_helper

constraints:
  never_assume_single_story: true
  relevance_must_not_create_causality: true
  quiet_regions_continue_evolving: true
  support_simultaneous_events: true
  preserve_partial_information_future_layer: true
  automatic_merge_main: false
