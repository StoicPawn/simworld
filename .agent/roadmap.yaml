project: simworld
version: 17
current_phase: cultural_knowledge_and_affordances

foundational_principles:
  geopolitical_by_construction: true
  spatial_first: true
  time_and_space_are_coequal_substrates: true
  map_is_causal_state_not_decoration: true
  terrain_roles_are_emergent: true
  population_precedes_settlements: true
  one_authoritative_aggregate_population_state: true
  total_population_includes_all_resolution_levels: true
  materialized_population_is_reserved_representation: true
  resolution_change_is_not_demographic_change: true
  compatibility_summaries_are_not_causal_state: true
  deterministic_semantic_replay: true
  technical_ids_must_be_causally_inert: true
  unrelated_random_scopes_are_isolated: true
  adaptive_resolution_must_not_perturb_unrelated_rng: true
  place_types_are_derived_views: true
  settlements_are_derived_when_possible: true
  residence_is_not_settlement: true
  sparse_social_state_over_space: true
  regions_are_derived_views: true
  strategic_value_is_emergent: true
  physical_truth_separate_from_actor_spatial_knowledge: true
  needs_are_pressures_not_policies: true
  actors_are_non_omniscient: true
  experience_belief_speech_action_are_distinct: true
  trust_is_contextual_and_historical: true
  perceived_learning_may_differ_from_causal_truth: true
  stories_are_information_objects_not_truth: true
  culture_is_emergent: true
  knowledge_is_actor_specific: true
  knowledge_may_be_partial_wrong_lost_or_rediscovered: true
  linguistic_categories_are_derived: true
  religious_categories_are_derived: true
  ethnicity_is_social_not_biological_truth: true
  biological_ancestry_phenotype_identity_are_distinct: true
  technology_uses_affordance_space_not_chronological_tree: true
  technological_prerequisites_enable_opportunity_not_outcome: true
  technology_may_be_local_lost_or_independently_rediscovered: true
  hardcode_constraints_and_possibilities_not_history: true
  cultural_convergence_and_divergence_are_competing_processes: true
  biological_kinship_is_not_social_identity: true
  household_is_not_kinship: true
  conception_is_not_birth: true
  inheritance_is_not_blood_only: true
  family_house_dynasty_are_emergent: true
  assets_precede_property_regimes: true
  possession_use_control_claim_are_distinct: true
  recognition_is_actor_specific: true
  documents_are_evidence_not_truth: true
  formal_property_is_derived_from_institutions: true
  inventory_is_not_wealth: true
  scarcity_is_not_prescribed_action: true
  obligation_is_not_consent: true
  dependency_is_not_loyalty: true
  organization_is_not_state: true
  authority_is_not_legitimacy: true
  authority_is_domain_specific: true
  heterogeneous_history_from_heterogeneous_processes: true
  never_target_event_counts: true
  prefer_generic_primitives_and_derived_views: true
  no_canonical_historical_interpretation: true

