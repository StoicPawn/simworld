constraints:
  never_assume_single_story: true
  relevance_must_not_create_causality: true
  quiet_regions_continue_evolving: true
  support_simultaneous_events: true
  aggregate_population_must_not_imply_settlement: true
  population_hotspot_must_not_create_settlement: true
  materialization_must_not_be_separate_population_truth: true
  actor_information_must_not_leak_world_truth: true
  needs_must_not_call_prescribed_actions: true
  communication_may_be_false_or_incomplete: true
  perceived_reward_must_be_distinguishable_from_latent_effect: true
  narratives_must_not_replace_event_truth: true
  culture_must_not_be_unexplained_static_stereotype: true
  kinship_must_not_imply_loyalty: true
  household_must_not_imply_blood_relation: true
  offspring_must_not_imply_romance: true
  inheritance_must_not_be_single_heir_by_default: true
  terrain_label_must_not_imply_historical_role: true
  place_view_must_not_create_causality: true
  residence_must_not_imply_settlement: true
  settlement_nucleus_must_not_create_causality: true
  construction_must_not_imply_building_type: true
  local_movement_must_not_imply_migration: true
  market_village_port_state_should_be_derived_when_possible: true
  social_spatial_state_must_be_sparse: true
  movement_must_not_imply_interaction: true
  copresence_must_not_imply_relationship: true
  asset_must_not_imply_property: true
  possession_must_not_imply_claim: true
  claim_must_not_imply_recognition: true
  recognition_must_not_imply_control: true
  documents_must_not_be_global_truth: true
  formal_property_requires_institutional_context: true
  wealth_must_not_replace_inventory_or_food_security: true
  scarcity_must_not_directly_trigger_policy_or_revolt: true
  compliance_must_not_imply_consent: true
  dependency_must_not_imply_loyalty: true
  organization_must_not_imply_statehood: true
  authority_must_not_imply_legitimacy: true
  authority_must_be_domain_specific: true
  do_not_tune_for_target_event_counts: true
  shocks_must_create_conditions_not_prescribed_actions: true
  heterogeneous_results_should_follow_from_heterogeneous_state: true
  prefer_generic_primitives_over_era_specific_categories: true
  avoid_heavyweight_object_per_planet_cell: true
  strategic_value_must_be_derived: true
  material_changes_require_development_ledger_update: true
  automatic_merge_main: false
